name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest + CLI (${{ matrix.os }}, Python 3.12)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # `python -m pytest` (não o `pytest` pelado): adiciona o CWD (raiz do repo)
      # ao sys.path, então `import api`/`import cross_source` etc. resolvem — é a
      # invocação canônica do CLAUDE.md. Com `pytest` pelado, a raiz fica fora do
      # path e tests/test_api.py quebra na coleta (ModuleNotFoundError: api).
      - name: Run pytest
        run: python -m pytest -q

      # Failure/partial runs are exercised with synthetic XLSX fixtures in pytest.
      # No market collection, prices, logs or artifacts are published by CI.
      - name: CLI help (offline)
        run: python run_integrated.py --help
